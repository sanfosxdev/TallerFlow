name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verificar google/Domain.gs regenerado
        run: |
          npm run google:build
          git diff --exit-code google/Domain.gs || { echo "google/Domain.gs está desactualizado. Corré 'npm run google:build' y commiteá el resultado."; exit 1; }
      - run: npm test
      - run: npm run build
      - name: Chequear sintaxis del gateway
        run: node --check api/index.js
